name: Discover new projects

# Runs on Sunday 18:00 UTC, 13 hours before the weekly cloud agent
# (Monday 07:00 UTC), which reads data/candidates.json written here.
# GitHub may start scheduled runs hours late (the Monday 06:00 run on
# 2026-10-19 started 5.5 hours late, after the agent had already read
# an old snapshot), so the run needs a margin of more than 12 hours.
# discover.py rewrites a snapshot with candidates or status hints on every run,
# so a fresh generated_at tells the agent the snapshot is from this week.
# An empty snapshot is rewritten at least every 28 days, so GitHub does not
# disable the schedules of this repository after 60 days without activity.
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Snapshot candidate repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/discover.py

      - name: Commit snapshot if it changed
        run: |
          if [ -z "$(git status --porcelain -- data/candidates.json)" ]; then
            echo "candidates.json unchanged"
            exit 0
          fi
          git config user.name "Asofwar"
          git config user.email "7397608+Asofwar@users.noreply.github.com"
          git add data/candidates.json
          git commit -m "Обновлён список кандидатов"
          git pull --rebase origin main && git push
