name: Discover new projects

# Runs one hour before the weekly cloud agent (Monday 07:00 UTC),
# which reads data/candidates.json written here. discover.py also rewrites
# the snapshot at least every 28 days, so GitHub does not disable the schedules
# of this repository after 60 days without activity.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Snapshot candidate repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/discover.py

      - name: Commit snapshot if it changed
        run: |
          if [ -z "$(git status --porcelain -- data/candidates.json)" ]; then
            echo "candidates.json unchanged"
            exit 0
          fi
          git config user.name "Asofwar"
          git config user.email "7397608+Asofwar@users.noreply.github.com"
          git add data/candidates.json
          git commit -m "Обновлён список кандидатов"
          git pull --rebase origin main && git push
